    <script type="text/javascript">
        function generateSessionId(length) {
          var characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          var sessionId = '';
          var charactersLength = characters.length;
          for (var i = 0; i < length; i++) {
            sessionId += characters.charAt(Math.floor(Math.random() * charactersLength));
          }
          return sessionId;
        }

        function setStrictlyNecessaryCookie(cookieName, cookieValue, expirationDays) {
          var expirationDate = new Date();
          expirationDate.setTime(expirationDate.getTime() + (expirationDays * 24 * 60 * 60 * 1000));
          var expires = "expires=" + expirationDate.toUTCString();
          document.cookie = encodeURIComponent(cookieName) + "=" + encodeURIComponent(cookieValue) + "; " + expires + "; path=/";
        }

        // Generate a session ID with a specific length, for example, 10 characters
        var sessionId = generateSessionId(10);
        setStrictlyNecessaryCookie("PromptbuyVersion", "1.0", 30)
        setStrictlyNecessaryCookie("PromptbuySession", sessionId, 30)

    </script>
